name: Update prices

# Scrapes, saves the new prices to the repo, then publishes docs/ to GitHub Pages.
# One run = one deploy (Settings → Pages → Source must be "GitHub Actions").
on:
  schedule:
    - cron: "30 6 * * *"   # every day ~6:30am UK time
  workflow_dispatch:        # "Run workflow" button on GitHub
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scraper/**"
      - "docs/**"
      - ".github/workflows/**"

permissions:
  contents: write   # commit the new prices
  pages: write      # publish the site
  id-token: write   # required by deploy-pages

concurrency:
  group: scrape-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Scrape
        run: python -m scraper.run

      - name: Save new prices to the repo
        run: |
          git config user.name "scrappy-bot"
          git config user.email "scrappy-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "No price changes"; exit 0; fi
          git commit -m "Update prices $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push

      - name: Publish site
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
