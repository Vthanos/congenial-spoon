name: Update prices

on:
  schedule:
    - cron: "30 6 * * *"   # every day ~6:30am UK time
  workflow_dispatch:        # "Run workflow" button on GitHub
  push:
    paths:
      - "data/manual_deals.csv"
      - "scraper/**"

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Scrape
        run: python -m scraper.run
      - name: Commit new prices
        run: |
          git config user.name "scrappy-bot"
          git config user.email "scrappy-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update prices $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
